<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" width="286" height="94" viewBox="0 0 286 94">
  <defs>
    <style>
      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 26px;
        font-weight: 900;
        font-style: italic;
        fill: #eafcff;
        letter-spacing: 1px;
      }
    </style>
    <radialGradient id="capGrad" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1a2533"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#050a12"/>
    </radialGradient>
    <radialGradient id="centerGrad" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1b2430"/>
      <stop offset="40%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#080d14"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ef0ff"/>
      <stop offset="40%" stop-color="#00b8ff"/>
      <stop offset="100%" stop-color="#005cff"/>
    </linearGradient>
    <linearGradient id="ringGradDim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2b3b"/>
      <stop offset="50%" stop-color="#0b3e69"/>
      <stop offset="100%" stop-color="#0d2240"/>
    </linearGradient>
    <radialGradient id="pressedFace" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#10253a"/>
      <stop offset="55%" stop-color="#091420"/>
      <stop offset="100%" stop-color="#050b12"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Neutral stick -->
  <g>
    <circle cx="47" cy="47" r="46" fill="#03070e"/>
    <circle cx="47" cy="47" r="43.5" fill="url(#ringGradDim)" opacity="0.95"/>
    <circle cx="47" cy="47" r="40.5" fill="#07111d"/>
    <circle cx="47" cy="47" r="38" fill="none" stroke="url(#ringGrad)" stroke-width="3.2" opacity="0.75" filter="url(#softGlow)"/>
    <circle cx="47" cy="47" r="27.3" fill="url(#centerGrad)"/>
    <circle cx="41" cy="40" r="8" fill="#23384d" opacity="0.42"/>
    <circle cx="47" cy="47" r="26.3" fill="none" stroke="#0a0e14" stroke-width="1.2"/>
  </g>

  <!-- L3 pressed style -->
  <g>
    <circle cx="143" cy="47" r="46" fill="#03070e"/>
    <circle cx="143" cy="47" r="43.5" fill="url(#ringGrad)" opacity="0.95" filter="url(#strongGlow)"/>
    <circle cx="143" cy="47" r="40.2" fill="#06101a"/>
    <circle cx="143" cy="47" r="36.8" fill="none" stroke="#8cf6ff" stroke-width="2.2" opacity="0.8"/>
    <circle cx="143" cy="47" r="27.3" fill="url(#pressedFace)"/>
    <circle cx="137" cy="40" r="8" fill="#2a4d73" opacity="0.35"/>
    <text x="143" y="56" text-anchor="middle" class="label" filter="url(#softGlow)">L3</text>
  </g>

  <!-- R3 pressed style -->
  <g>
    <circle cx="239" cy="47" r="46" fill="#03070e"/>
    <circle cx="239" cy="47" r="43.5" fill="url(#ringGrad)" opacity="0.95" filter="url(#strongGlow)"/>
    <circle cx="239" cy="47" r="40.2" fill="#06101a"/>
    <circle cx="239" cy="47" r="36.8" fill="none" stroke="#8cf6ff" stroke-width="2.2" opacity="0.8"/>
    <circle cx="239" cy="47" r="27.3" fill="url(#pressedFace)"/>
    <circle cx="233" cy="40" r="8" fill="#2a4d73" opacity="0.35"/>
    <text x="239" y="56" text-anchor="middle" class="label" filter="url(#softGlow)">R3</text>
  </g>
</svg>
